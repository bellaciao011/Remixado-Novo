kind = "web"
previewPath = "/"
title = "Panini FIFA World Cup 2026 Store"
version = "1.0.0"
id = "artifacts/panini-wc2026"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18989

[services.development]
run = "pnpm --filter @workspace/panini-wc2026 run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/panini-wc2026", "run", "build" ]
publicDir = "artifacts/panini-wc2026/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18989"
BASE_PATH = "/"
