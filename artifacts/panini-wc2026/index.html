<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Panini FIFA World Cup 2026 Store</title>
    <meta name="description" content="Panini FIFA World Cup 2026 Store — built on Replit. Update this description to reflect the app." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Panini FIFA World Cup 2026 Store" />
    <meta property="og:description" content="Panini FIFA World Cup 2026 Store — built on Replit. Update this description to reflect the app." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Panini FIFA World Cup 2026 Store" />
    <meta name="twitter:description" content="Panini FIFA World Cup 2026 Store — built on Replit. Update this description to reflect the app." />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Preload LCP hero image — directly discoverable in initial HTML, not hash-gated by JS -->
    <link rel="preload" as="image" href="/assets/image_1780982521586.png" type="image/png" fetchpriority="high" />

    <!-- Preconnect to critical third-party origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://connect.facebook.net" />
    <link rel="dns-prefetch" href="https://cdn.utmify.com.br" />

    <!-- UTMify — pixel + UTM capture, always active on all pages -->
    <script>
      window.pixelId = "6a2f68f52c45dfed4cb80974";
      var a = document.createElement("script");
      a.setAttribute("async", "");
      a.setAttribute("defer", "");
      a.setAttribute("src", "https://cdn.utmify.com.br/scripts/pixel/pixel.js");
      document.head.appendChild(a);
    </script>
    <script
      src="https://cdn.utmify.com.br/scripts/utms/latest.js"
      data-utmify-prevent-xcod-sck
      data-utmify-prevent-subids
      async
      defer
    ></script>

    <!-- Google Fonts — non-blocking via preload + onload swap -->
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" />
    </noscript>

    <!-- Critical CSS inline: renders above-the-fold layout before the full CSS bundle arrives -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html { line-height: 1.5; -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #ffffff;
        color: #1a1a1a;
        -webkit-font-smoothing: antialiased;
      }
      #root { min-height: 100vh; display: flex; flex-direction: column; }
      img { display: block; max-width: 100%; height: auto; }
      .hero-section { width: 100%; background-color: #000000; }
    </style>

    <!--
      Analytics loading strategy:
      ─────────────────────────────────────────────────────────────────────
      Set VITE_FB_PIXEL_ID in environment variables to enable Facebook Pixel.
      UTMify is loaded statically above (hardcoded pixel ID).

      CONFIRMATION PAGE (/pedido/confirmado):
        Analytics are loaded IMMEDIATELY so fbq exists before React mounts
        and fires the Purchase event.

      ALL OTHER PAGES:
        Deferred to window.load + 200 ms to avoid blocking FCP/LCP.
      ─────────────────────────────────────────────────────────────────────
    -->
    <script>
      var FB_PIXEL_ID = '%VITE_FB_PIXEL_ID%';

      function initAnalytics() {
        if (!FB_PIXEL_ID || FB_PIXEL_ID === '%VITE_FB_PIXEL_ID%') return;

        // ── Facebook Pixel ────────────────────────────────────────────
        !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
        n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
        n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
        t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
        document,'script','https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', FB_PIXEL_ID);
        fbq('track', 'PageView');
        // UTMify is loaded statically above — no duplication needed here
      }

      if (window.location.href.indexOf('pedido/confirmado') !== -1) {
        initAnalytics();
      } else {
        window.addEventListener('load', function() {
          setTimeout(initAnalytics, 200);
        });
      }
    </script>
  </head>
  <body>
    <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=%VITE_FB_PIXEL_ID%&ev=PageView&noscript=1" /></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
